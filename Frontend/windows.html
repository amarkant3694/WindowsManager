<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Remote PC Manager</title>
    <link rel="stylesheet" href="windows.css">
</head>
<body>

<header>
    <div class="brand">Remote PC Manager</div>
</header>

<nav>
    <button class="nav-btn active" data-page="files" onclick="switchPage('files')">File System</button>
    <button class="nav-btn" data-page="terminal" onclick="switchPage('terminal')">Terminal</button>
    <button class="nav-btn" data-page="dashboard" onclick="switchPage('dashboard')">Dashboard</button>
</nav>

<main>

<!-- FILE SYSTEM (DEFAULT PAGE) -->
<section id="files" class="page active">
    <h3>File Explorer</h3>

    <div class="file-nav">
        <button onclick="navigateBack()">← Back</button>
        <button onclick="navigateForward()">Forward →</button>
    </div>

    <select id="root-select" onchange="changeRoot()"></select>
    <div id="file-root-label"></div>
    <div id="file-tree-root"></div>
</section>

<!-- TERMINAL -->
<section id="terminal" class="page">
    <h3>Terminal</h3>
    <div id="terminal-output"></div>
    <input id="term-input" />
</section>

<!-- DASHBOARD -->
<section id="dashboard" class="page">
    <h3>Dashboard</h3>
</section>

</main>

<div id="toast-container"></div>

<script>
function switchPage(pageId) {
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));

    document.getElementById(pageId).classList.add("active");
    document.querySelector(`[data-page="${pageId}"]`).classList.add("active");

    // ✅ Correct function
    if (pageId === "files" && typeof loadRoots === "function") {
        loadRoots();
    }
}
</script>

<script src="app.js"></script>
</body>
</html>
